.pass-banner .notification-item{z-index:2}

.passcode-title.error-text{color:#ff3b30}

.num-btn{width:80px;height:80px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;font-size:32px;display:flex;align-items:center;justify-content:center;transition:background .18s ease,transform .18s cubic-bezier(.32,.72,0,1)}
.num-btn:active{background:rgba(255,255,255,.22);transform:scale(.95)}
.btn-cancel{grid-column:1;font-size:17px}
.btn-delete{grid-column:3;font-size:19px}
.config-overlay{position:fixed;inset:0;background:rgba(0,0,0,.42);backdrop-filter:blur(5px);z-index:99;display:none;align-items:center;justify-content:center;padding:16px}
.config-modal{width:100%;max-width:340px;max-height:78vh;overflow-y:auto;background:rgba(28,28,30,.92);border-radius:18px;padding:18px}
.config-group{margin-bottom:14px}
.config-label{font-size:14px;color:#aeaeb2;display:block;margin-bottom:6px;font-weight:500}
.config-input-wrap{position:relative}
.config-input,.config-textarea{width:100%;background:#2c2c2e;border:0;border-radius:12px;color:#fff;font-size:14px;padding:11px 14px;outline:none}
.config-textarea{min-height:90px;resize:vertical;line-height:1.45}
.eye-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:22px;height:22px;fill:#8e8e93;cursor:pointer}
.avatar-row{display:flex;align-items:center;gap:12px}
.avatar-circle{width:48px;height:48px;border-radius:50%;overflow:hidden;cursor:pointer;background:#3a3a3c;flex-shrink:0;border:1px solid #4a4a4c}
.avatar-circle img{width:100%;height:100%;object-fit:cover}
.avatar-input-hidden{display:none}

.im-page{
    position:absolute;inset:0;z-index:60;
    background:#000;color:#fff;
    display:none;flex-direction:column;overflow:hidden;
    opacity:0;transform:scale(.985);
    background-size:cover;background-position:center;
}
.im-page.show{display:flex;animation:imPageIn .42s cubic-bezier(.32,.72,0,1) forwards}
@keyframes imPageIn{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:scale(1)}}

.im-status{display:flex;justify-content:space-between;padding:6px 20px 2px;font-size:15px;font-weight:600;flex-shrink:0}
.im-header{display:flex;align-items:flex-start;justify-content:space-between;padding:2px 12px 8px;flex-shrink:0}
.im-back{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.08);padding:6px 10px;border-radius:999px;font-size:17px;cursor:pointer}
.im-center{text-align:center;flex:1}

.im-avatar{
    width:54px;height:54px;border-radius:50%;margin:0 auto -9px;position:relative;z-index:2;
    background:radial-gradient(circle at 36% 28%, rgba(255,255,255,0.18) 0%, transparent 32%),linear-gradient(145deg, #636378 0%, #424252 48%, #353542 100%);
    box-shadow:inset 0 1px 1px rgba(255,255,255,.35),inset 0 -1px 1px rgba(0,0,0,.35),0 2px 4px rgba(0,0,0,.55);overflow:visible;cursor:pointer;
}
.im-avatar::before{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%, rgba(255,255,255,.32), transparent 35%),linear-gradient(145deg, rgba(255,255,255,.98), rgba(245,245,255,.92));top:11px;left:50%;transform:translateX(-50%);}
.im-avatar::after{content:"";position:absolute;width:30px;height:16px;border-radius:16px;background:radial-gradient(circle at 50% 25%, rgba(255,255,255,.32), transparent 35%),linear-gradient(145deg, rgba(255,255,255,.98), rgba(250,250,255,.92));bottom:10px;left:50%;transform:translateX(-50%);}
.im-avatar.use-photo{overflow:hidden}
.im-avatar.use-photo::before,.im-avatar.use-photo::after{display:none}
.im-avatar.use-photo img{width:100%;height:100%;object-fit:cover;display:block;border-radius:50%}

.im-name-pill{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.08);border-radius:999px;padding:9px 32px 9px 14px;position:relative;z-index:1;width:fit-content;margin:0 auto;cursor:pointer}
.im-name{font-size:17px;font-weight:500;letter-spacing:.3px}
.im-name-arrow{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:#8e8e93;font-size:16px}
.im-name-input{display:none;background:transparent;border:none;outline:none;color:#fff;font-size:17px;font-weight:500;letter-spacing:.3px;width:100%;text-align:center;padding:0;margin:0;font-family:inherit;}
.im-cam{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;flex-shrink:0}

#chatWallpaperInput{display:none}

.im-chat{flex:1;padding:12px 12px 4px;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:6px;scroll-behavior:smooth}
.im-chat-info{text-align:center;margin-bottom:10px;color:#8e8e93;font-size:12px;line-height:1.6;opacity:0;animation:fadeIn 0.8s ease forwards;}

.im-row{display:flex;align-items:center;gap:8px;margin:0;opacity:0;will-change:transform,opacity;animation:msgFadeIn 1.5s cubic-bezier(0.22,0.61,0.36,1) forwards}

.im-row .im-bubble-avatar::after{content:"";position:absolute;width:20px;height:11px;border-radius:11px;background:linear-gradient(145deg, rgba(255,255,255,.98), rgba(250,250,255,.92));bottom:6px;left:50%;transform:translateX(-50%);}

.im-bubble{max-width:66%;padding:8px 14px;font-size:15px;line-height:1.35;word-wrap:break-word;border-radius:18px;background:#3a3a3c;color:#fff;min-height:36px;display:flex;align-items:center;}
.im-typing{display:flex;gap:4px;padding:0 14px;min-height:36px;align-items:center;background:#3a3a3c;border-radius:18px;width:fit-content;}
.im-typing .d{width:8px;height:8px;border-radius:50%;background:#949498;animation:typingBounce 1.4s infinite ease-in-out}
.im-typing .d:nth-child(2){animation-delay:.2s}
.im-typing .d:nth-child(3){animation-delay:.4s}
@keyframes typingBounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}
.im-delivered{text-align:right;font-size:9px;color:#8e8e93;margin:0;opacity:0;animation:msgFadeIn 0.6s cubic-bezier(0.25,0.1,0.25,1) 0.35s forwards}

<script>
const $ = id =>document.getElementById(id);
const lockPage = $("lockPage"), passPage = $("passPage"), passBlurWallpaper = $("passBlurWallpaper");
const notifyStackWrap = $("notifyStackWrap"), replyOverlay = $("replyOverlay");
const replyInput = $("replyInput"), replyCancel = $("replyCancel"), replySend = $("replySend");
const configOverlay = $("configOverlay"), statusTimeDom = $("statusTime");
const eyeIcon = $("eyeIcon"), eyeShow = eyeIcon.querySelector(".eye-path-show"), eyeHide = eyeIcon.querySelector(".eye-path-hide");
const apiKeyInput = $("apiKey"), apiBaseInput = $("apiBase"), systemPromptInput = $("systemPrompt");
const avatarCircle = $("avatarCircle"), avatarUploadInput = $("avatarUpload"), avatarImg = $("avatarImg");
const assistantNameInput = $("assistantName"), passTitle = $("passTitle"), dotWrap = $("dotWrap");
const homeIndicator = $("homeIndicator");

let startY = 0, currentTranslateY = 0, activeNotifyItem = null;
const threshold = 120, correctPassword ="123456";
let chatHistory = [], hasGreeted = false, roundId = 0;
let isPasscodeOpen = false, passBannerTimer = null, homeTimer = null;

const imPage = $("imPage"), imChat = $("imChat"), imInput = $("imInput");
const imSend = $("imSend"), imBack = $("imBack"), imAvatar = $("imAvatar");
const imName = $("imName"), imNamePill = $("imNamePill"), imStatusTime = $("imStatusTime");
const imNameInput = $("imNameInput");
const myAvatarInput = $("myAvatarInput");
const chatWallpaperInput = $("chatWallpaperInput"), imCam = $("imCam");
let myAvatarSrc ="";
let imHistory = [];
let imIsSending = false;
let deliveryChain = Promise.resolve();   // 统一投递队列

/* ===== 节奏参数（想微调只动这里）===== */
const MIN_PER_BURST = 3, MAX_PER_BURST = 6;  // 一轮随机 3–6 条
const REPLY_DELAY   = 3000;                  // 你发完 3s 后本轮第一条开始
const GAP_MIN = 3000, GAP_MAX = 3000;        // 每条之间：静默 3s
const TYPING_MIN = 2500, TYPING_MAX = 2500;  // 打字动画 2.5s
function gapDuration(){ return GAP_MIN + Math.random()*(GAP_MAX - GAP_MIN); }
function typingDuration(){ return TYPING_MIN + Math.random()*(TYPING_MAX - TYPING_MIN); }

function getAssistantInfo(){
  return { name: assistantNameInput.value.trim() || "+86 102713", avatarSrc: avatarImg.src };
}
function pageH(){ return document.querySelector(".lockscreen-wrap").getBoundingClientRect().height / 0.94; }
function imOpen(){ return imPage.classList.contains("show"); }
function wait(ms){ return new Promise(r=>setTimeout(r, ms)); }

let notifyAudioCtx = null;
function playNotifySound(){
  if(imOpen()) return;
  try{
    if(!notifyAudioCtx) notifyAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(notifyAudioCtx.state === "suspended") notifyAudioCtx.resume();
    const ctx = notifyAudioCtx, t = ctx.currentTime;
    [[784,0],[1175,.1]].forEach(([f,d])=>{
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type='sine'; o.frequency.setValueAtTime(f,t+d);
      g.gain.setValueAtTime(.0001,t+d);
      g.gain.exponentialRampToValueAtTime(.28,t+d+.005);
      g.gain.exponentialRampToValueAtTime(.001,t+d+.14);
      o.connect(g).connect(ctx.destination); o.start(t+d); o.stop(t+d+.15);
    });
  }catch(e){}
}
let audioCtx;
function playKeySound(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type='sine'; o.frequency.value=1200;
  g.gain.setValueAtTime(.15,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+.05);
  o.connect(g).connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+.05);
}

function updateStackState(){
  const wraps = notifyStackWrap.querySelectorAll(".notification-wrap");
  const count = wraps.length;
  notifyStackWrap.querySelectorAll(".notify-count").forEach(el=>el.remove());

  if(count >= 4){
    notifyStackWrap.classList.remove("expanded");
    notifyStackWrap.classList.add("stacked");
    const item = wraps[0].querySelector(".notification-item");
    if(item){
      const badge = document.createElement("div");
      badge.className = "notify-count"; badge.textContent = count;
      item.appendChild(badge);
    }
    wraps.forEach((w,i)=>{
      const rep = w.querySelector(".btn-reply");
      if(rep) rep.style.display = i === 0 ? "" : "none";
    });
  } else {
    notifyStackWrap.classList.remove("stacked","expanded");
    wraps.forEach(w=>{
      const rep = w.querySelector(".btn-reply");
      if(rep) rep.style.display = "";
    });
  }
}

notifyStackWrap.addEventListener("click", e=>{
  if(e.target.closest(".notify-action-btn")) return;
  if(notifyStackWrap.classList.contains("stacked")){
    notifyStackWrap.classList.add("expanded");
    notifyStackWrap.classList.remove("stacked");
    notifyStackWrap.querySelectorAll(".notify-count").forEach(el=>el.remove());
    notifyStackWrap.querySelectorAll(".notification-wrap .btn-reply").forEach(rep=>{
      rep.style.display = "";
    });
    return;
  }
  if(notifyStackWrap.classList.contains("expanded")){
    if(e.target.closest(".notification-item")) return;
    notifyStackWrap.classList.add("stacked");
    notifyStackWrap.classList.remove("expanded");
    updateStackState();
  }
});

function bindSwipe(wrap, itemDom, onDelete, onReply, onSlideOpen){
  const MAX = 160;
  let offset = 0, startX=0, startY=0, startOffset=0, locked=null;

  function setX(x, animate){
    offset = Math.max(-MAX, Math.min(0, x));
    itemDom.style.transition = animate ? "transform .32s cubic-bezier(.32,.72,0,1)" : "none";
    itemDom.style.transform = `translateX(${offset}px)`;
    wrap.classList.toggle("swiped", offset < -4);
  }
  function onStart(x, y){
    if(notifyStackWrap.classList.contains("stacked")) return;
    startX=x; startY=y; startOffset=offset; locked=null;    itemDom.style.transition = "none";
  }
  function onMove(x, y){
    const dx = x-startX, dy = y-startY;
    if(locked === null){
      if(Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 6) locked = "x";
      else if(Math.abs(dy) > 6) locked = "y";
    }
    if(locked !== "x") return;
    setX(startOffset + dx, false);
  }
  function onEnd(){
    if(locked === "x"){
      const open = offset < -MAX/2;
      setX(open ? -MAX : 0, true);
      if(open && onSlideOpen) onSlideOpen();
    }
    locked = null;
  }

  itemDom.addEventListener("touchstart", e=>onStart(e.touches[0].clientX, e.touches[0].clientY));
  itemDom.addEventListener("touchmove", e=>onMove(e.touches[0].clientX, e.touches[0].clientY));
  itemDom.addEventListener("touchend", onEnd);

  itemDom.addEventListener("mousedown", e=>{
    onStart(e.clientX, e.clientY);
    function mm(ev){ onMove(ev.clientX, ev.clientY); }
    function mu(){
      onEnd();
      document.removeEventListener("mousemove", mm);
      document.removeEventListener("mouseup", mu);
    }
    document.addEventListener("mousemove", mm);
    document.addEventListener("mouseup", mu);
  });

  itemDom.addEventListener("click", e=>{
    if(notifyStackWrap.classList.contains("stacked")) return;
    if(offset > -MAX/2) return;
    const rect = wrap.getBoundingClientRect();
    const x = e.clientX - rect.left;
    if(x < rect.width - MAX) return;
    if(x > rect.width - 80) onDelete();
    else if(onReply) onReply();
  });

  const delBtn = wrap.querySelector(".btn-delete");
  const repBtn = wrap.querySelector(".btn-reply");
  [delBtn,repBtn].forEach(b=>{
    if(!b) return;
    b.addEventListener("mousedown", e=>e.stopPropagation());
    b.addEventListener("touchstart", e=>e.stopPropagation());
  });
  if(delBtn) delBtn.onclick = e=>{ e.stopPropagation(); onDelete(); };
  if(repBtn) repBtn.onclick = e=>{ e.stopPropagation(); onReply && onReply(); };
}

function createNotification(msgText, withSound){
  const info = getAssistantInfo();
  const timeStr = new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false});  const wrap = document.createElement('div');
  wrap.className = "notification-wrap";
  wrap.innerHTML = `
    <div class="notify-action-bg">
      <div class="notify-action-btn btn-reply">回复</div>
      <div class="notify-action-btn btn-delete">删除</div>
    </div>
    <div class="notification-item notify-enter-animate">
      <div class="notify-avatar"><img src="${info.avatarSrc}" alt=""></div>
      <div class="notify-content">
        <div class="notify-name">${info.name}</div>
        <div class="notify-text">${msgText}<span class="notify-time">${timeStr}</span></div>
      </div>
    </div>`;
  notifyStackWrap.insertBefore(wrap, notifyStackWrap.firstChild);
  if(withSound) playNotifySound();
  updateStackState();

  const itemDom = wrap.querySelector(".notification-item");
  itemDom.addEventListener("animationend", ()=>{
    itemDom.classList.remove("notify-enter-animate");
    itemDom.style.transform = "translateX(0)";
  });

  bindSwipe(
    wrap, itemDom,
    ()=>{ wrap.remove(); updateStackState(); },
    ()=>openReplyFor(wrap)
  );
  return wrap;
}
function addNotification(msgText){ return createNotification(msgText, true); }
function addNotificationToStack(msgText){ return createNotification(msgText, false); }

function landMessage(text){
  imHideTyping();
  imHistory.push({ role:"other", text });
  saveAllData(); // 保存聊天数据
  imAppendBubble(text, false);     // iMessage 里带入场动画
  imScrollBottom();
  notifyOnLock(text);              // 锁屏同步
}

function deliverMessage(text, skipGap, rid){
  if(!text) return deliveryChain;
  deliveryChain = deliveryChain.then(async ()=>{
    if(rid !== roundId) return;              // 这一轮已被新消息取代 → 这条不发了
    if(!skipGap) await wait(gapDuration());  // 上一条落地后静默 3s
    if(rid !== roundId) return;
    imShowTyping();                          // 打字动画出现（已在就不重开）
    await wait(typingDuration());            // 打字 2.5s
    if(rid !== roundId) return;              // 打字期间来了新消息 → 这条不发，动画留着
    landMessage(text);                       // 消息落地（锁屏此刻同步弹出）
  });
  return deliveryChain;
}

function splitLines(text){
  return String(text).split(/[\n。！？!?…]+/).map(s=>s.trim()).filter(Boolean);
}
function refineLines(lines, need){
  if(lines.length >= need) return lines;
  const out = [];
  lines.forEach(l=>{
    const parts = l.split(/[，,；;：:—]+/).map(s=>s.trim()).filter(Boolean);
    if(parts.length > 1) out.push(...parts); else out.push(l);
  });
  return out;
}

async function requestAI(userMsg){
  const key = apiKeyInput.value.trim();
  const baseUrl = apiBaseInput.value.trim();
  const sysPrompt = systemPromptInput.value.trim();

  chatHistory.push({ role:"user", content: userMsg || "（继续）" });
  if(chatHistory.length > 40) chatHistory = chatHistory.slice(-40);

  if(!key || !sysPrompt){
    await wait(2000);
    return "。";
  }
  try{
    const resp = await fetch(`${baseUrl}/v1/chat/completions`,{
      method:"POST",
      headers:{ "Authorization":`Bearer ${key}`, "Content-Type":"application/json" },
      body:JSON.stringify({
        model:"deepseek-chat",
        messages:[{role:"system", content: sysPrompt}, ...chatHistory],
        temperature:0.8
      })
    });
    const data = await resp.json();
    const aiText = data.choices[0].message.content;
    chatHistory.push({role:"assistant", content: aiText});
    if(chatHistory.length > 40) chatHistory = chatHistory.slice(-40);
    return aiText;
  }catch(e){
    return "消息发送失败，请检查API配置";
  }
}
async function fetchLines(need, userMsg){
  let lines = [];
  let msg = userMsg;
  for(let r = 0; r < 3 && lines.length < need; r++){    const raw = await requestAI(msg);
    msg = null;
    if(!raw) break;
    lines = lines.concat(splitLines(raw));
  }
  return refineLines(lines, need);
}

function pushBatch(lines, count, rid){
  const n = Math.min(count, lines.length);
  for(let i = 0; i < n; i++) deliverMessage(lines[i], i === 0, rid);
  return deliveryChain;
}

async function handleUserMessage(userMsg){
  roundId++;                        // 新一轮开始，上一轮没发完的作废
  const rid = roundId;
  const batch = MIN_PER_BURST + Math.floor(Math.random()*(MAX_PER_BURST - MIN_PER_BURST + 1)); // 3–6
  const linesPromise = fetchLines(batch, userMsg);            // 请求与 3s 并行
  await wait(REPLY_DELAY);          // 发完 3s 才开始回
  const lines = await linesPromise;
  if(rid !== roundId) return;       // 等请求期间你又发了 → 这轮作废
  pushBatch(lines, batch, rid);
}

function imAppendBubble(text, isMe, animate=true){
  const safe = String(text).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const row = document.createElement("div");
  row.className = "im-row " + (isMe ? "me" : "other");
  if(!animate){ row.style.animation = "none"; row.style.opacity = "1"; }

  const av = document.createElement("div");
  av.className = "im-bubble-avatar";
  if(isMe){
    if(myAvatarSrc){
      av.classList.add("use-photo");
      av.innerHTML = `<img src="${myAvatarSrc}" alt="">`;
    }
    av.title = "点击设置我的头像";
    av.onclick = ()=> myAvatarInput.click();
  } else {
    const info = getAssistantInfo();
    if(info.avatarSrc && info.avatarSrc !== window.location.href){
      av.classList.add("use-photo");
      av.innerHTML = `<img src="${info.avatarSrc}" alt="">`;
    }
  }

  const bub = document.createElement("div");
  bub.className = "im-bubble";
  bub.innerHTML = safe;

  row.appendChild(av);
  row.appendChild(bub);
  imChat.appendChild(row);

  if(isMe){
    const tip = document.createElement("div");
    tip.className = "im-delivered";
    tip.textContent = "已送达";
    imChat.appendChild(tip);
  }
}

function applySlide(open){
  lockPage.style.transition = open
    ? "transform .48s cubic-bezier(.33,1,.66,1)"
    : "transform .62s cubic-bezier(.32,.72,0,1)";
  if(open){
    currentTranslateY = -pageH();
    notifyStackWrap.classList.add("hidden-notify");
    showHomeIndicator();
  } else {
    currentTranslateY = 0;
    notifyStackWrap.classList.remove("hidden-notify");
    resetHomeIndicator();
  }
  isPasscodeOpen = open;
  lockPage.style.transform = `translateY(${currentTranslateY}px)`;
}

lockPage.addEventListener('touchstart', e=>{ startY = e.touches[0].clientY; lockPage.style.transition ="none"; });
lockPage.addEventListener('touchmove', e=>{
  const diff = startY - e.touches[0].clientY;
  if(diff >= 0){
    currentTranslateY = -Math.min(diff, pageH());
    lockPage.style.transform = `translateY(${currentTranslateY}px)`;
  }
});
lockPage.addEventListener('touchend', ()=>{ applySlide(Math.abs(currentTranslateY)>threshold); });

passPage.addEventListener('touchstart', e=>{ startY = e.touches[0].clientY; lockPage.style.transition ="none"; });
passPage.addEventListener('touchmove', e=>{
  const diff = e.touches[0].clientY - startY;
  if(diff > 0){
    currentTranslateY = -pageH() + Math.min(diff, pageH());
    lockPage.style.transform = `translateY(${currentTranslateY}px)`;
  }
});
passPage.addEventListener('touchend', ()=>{
  const offset = pageH() + currentTranslateY;
  applySlide(offset <= threshold);
});

function bindMouseDrag(target, isPullDown){
  target.addEventListener('mousedown', e=>{
    startY = e.clientY;
    lockPage.style.transition = "none";
    function mouseMove(ev){
      const delta = isPullDown ? ev.clientY - startY : startY - ev.clientY;
      if(!isPullDown && delta >= 0){
        currentTranslateY = -Math.min(delta, pageH());
      } else if(isPullDown && delta > 0){
        currentTranslateY = -pageH() + Math.min(delta, pageH());
      }
      lockPage.style.transform = `translateY(${currentTranslateY}px)`;
  }    function mouseUp(){
      if(!isPullDown) applySlide(Math.abs(currentTranslateY) > threshold);
      else applySlide(pageH() + currentTranslateY <= threshold);
      document.removeEventListener('mousemove', mouseMove);
      document.removeEventListener('mouseup', mouseUp);
    }
    document.addEventListener('mousemove', mouseMove);
    document.addEventListener('mouseup', mouseUp);
  });
}

document.querySelectorAll(".num-btn").forEach(btn=>{

    if(txt === "取消"){
      pwdInput = [];

    } else if(txt === "⌫"){

      pwdInput.push(txt);

            pwdInput = [];

          }, 400);
        }
      }
    }

function leapMonth(y){ return lunarInfo[y-1900]&0xf; }
function leapDays(y){ return leapMonth(y) ? ((lunarInfo[y-1900]&0x10000) ? 30 : 29) : 0; }
function monthDays(y,m){ return (lunarInfo[y-1900]&(0x10000>>m)) ? 30 : 29; }

function lunarYearDays(y){
  let sum = 348;
  for(let i=0x8000; i>0x8; i>>=1) sum += (lunarInfo[y-1900] & i) ? 1 : 0;
  return sum + leapDays(y);
}

function solarToLunar(date){
  const baseDate = Date.UTC(1900,0,31);
  let offset = Math.floor((Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()) - baseDate) / 86400000);
  let i, temp = 0;
  for(i=1900; i<2101 && offset>0; i++){
    temp = lunarYearDays(i);
    offset -= temp;
  }
  if(offset < 0){ offset += temp; i--; }
  const lunarYear = i;
  const leap = leapMonth(i);
  let isLeap = false;
  let j;
  for(j=1; j<13 && offset>0; j++){
    if(leap>0 && j===(leap+1) && !isLeap){
      --j; isLeap = true; temp = leapDays(i);
    } else {
      temp = monthDays(i, j);
    }
    if(isLeap && j===(leap+1)) isLeap = false;
    offset -= temp;
  }
  if(offset===0 && leap>0 && j===leap+1){
    if(isLeap){ isLeap = false; } else { isLeap = true; --j; }
  }
  if(offset < 0){ offset += temp; --j; }
  const lunarMonth = j;
  const lunarDay = offset + 1;
  return { year: lunarYear, month: lunarMonth, day: lunarDay, isLeap };
}

function lunarYearName(lunarYear){
  const idx = (lunarYear - 4) % 60;
  const stem = heavenlyStems[idx % 10];
  const branch = earthlyBranches[idx % 12];
  const zodiac = zodiacs[idx % 12];
  return { ganZhi: stem + branch, zodiac };
}

function getLunarText(date){
  const l = solarToLunar(date);
  const { ganZhi, zodiac } = lunarYearName(l.year);
  const monthStr = (l.isLeap ? "闰" : "") + lunarMonthName[l.month-1] + "月";
  const dayStr = lunarDayName[l.day-1];
  return `${ganZhi}${zodiac}年${monthStr}${dayStr}`;
}
